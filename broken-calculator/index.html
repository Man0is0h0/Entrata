<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <header>
            <h1>Broken Calculator</h1>
            <p>Test discount and tax calculations. Can you spot the bug?</p>
        </header>

        <main>
            <form id="calc-form">
                <div class="input-group">
                    <label for="price">Original Price ($)</label>
                    <input type="number" id="price" step="0.01" min="0" max="100000000" placeholder="e.g. 100.00" required>
                </div>

                <div class="input-group">
                    <label for="quantity">Quantity (Optional)</label>
                    <input type="number" id="quantity" step="1" min="1" max="10000" placeholder="1" value="1">
                </div>

                <div class="input-group">
                    <label for="discount">Discount Percentage (%)</label>
                    <input type="number" id="discount" step="0.1" min="0" max="100" placeholder="e.g. 10" required>
                </div>

                <div class="input-group">
                    <label for="tax">Tax Percentage (%)</label>
                    <input type="number" id="tax" step="0.1" min="0" max="100" placeholder="e.g. 18" required>
                </div>

                <div id="error-message" class="error-message hidden"></div>

                <button type="submit" id="calculate-btn">Calculate</button>
            </form>

            <div id="results" class="results-container hidden">
                <h2>Calculation Breakdown</h2>
                <p class="hint">Try the sample values and inspect the calculation carefully.</p>
                <div class="result-row">
                    <span>Subtotal:</span>
                    <span id="res-subtotal" class="amount"></span>
                </div>
                <div class="result-row discount">
                    <span>Discount Amount:</span>
                    <span id="res-discount-amt" class="amount"></span>
                </div>
                <div class="result-row">
                    <span>Discounted Amount:</span>
                    <span id="res-discounted-amt" class="amount"></span>
                </div>
                <div class="result-row tax">
                    <span>Tax Amount:</span>
                    <span id="res-tax-amt" class="amount"></span>
                </div>
                <hr>
                <div class="result-row total">
                    <span>Final Payable Total:</span>
                    <span id="res-final" class="amount"></span>
                </div>
            </div>
        </main>
    </div>

    <!-- Import logic first, then DOM interactions -->
    <script src="src/calculator.js"></script>
    <script src="script.js"></script>
</body>
</html>
